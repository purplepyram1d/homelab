<!--
  ossec.conf snippet — Sysmon EventChannel ingestion
  Add this <localfile> block to the Wazuh agent ossec.conf on each
  Windows host where Sysmon is running.

  Default agent config location:
    C:\Program Files (x86)\ossec-agent\ossec.conf

  After editing, restart the agent:
    net stop wazuhsvc && net start wazuhsvc
-->

<localfile>
  <location>Microsoft-Windows-Sysmon/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>
